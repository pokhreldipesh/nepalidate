name: CI

on:
  push:
    branches: [main, v3.0]
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ansi

      - name: Run Pint (style check)
        run: vendor/bin/pint --test --format agent

      - name: Run PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=-1

      - name: Run Rector (dry-run)
        run: vendor/bin/rector --dry-run --no-progress-bar

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ansi

      - name: Run Pest
        run: vendor/bin/pest tests --parallel
